services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nova_ai
      MYSQL_USER: nova_user
      MYSQL_PASSWORD: replace-with-a-strong-password
      MYSQL_ROOT_PASSWORD: replace-with-another-strong-password
    ports:
      - "3306:3306"
    volumes:
      - nova_ai_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-preplace-with-another-strong-password"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  nova_ai_mysql:
